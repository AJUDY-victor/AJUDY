<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Ajudy – Connexion</title>
<style>
:root{--ink:#16261f;--forest:#1e6b52;--sun:#f2b138;--paper:#fbfcfa;--mist:#e4ece7;--err:#b3261e}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;display:flex;flex-direction:column;justify-content:center;background:var(--paper);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;line-height:1.45}
main{width:100%;max-width:420px;margin:0 auto;padding:32px 24px}
.mark{width:56px;height:56px;border-radius:50%;background:var(--forest);color:var(--sun);display:grid;place-items:center;font-size:28px;font-weight:700;margin-bottom:20px}
h1{font-size:2rem;margin:0 0 6px}
p.lead{margin:0 0 28px;color:#46574f}
label{display:block;font-weight:600;margin:16px 0 6px}
input{width:100%;padding:14px;font-size:1rem;border:2px solid var(--mist);border-radius:10px;background:#fff;color:var(--ink)}
input:focus-visible,button:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
button.main{width:100%;margin-top:24px;padding:15px;font-size:1.05rem;font-weight:700;border:0;border-radius:10px;background:var(--forest);color:#fff;cursor:pointer}
button.main:disabled{opacity:.6}
button.link{background:none;border:0;padding:12px 0;color:var(--forest);font-size:.95rem;text-decoration:underline;cursor:pointer}
#msg{min-height:1.4em;margin-top:14px;font-size:.95rem}
#msg.err{color:var(--err)}#msg.ok{color:var(--forest)}
#home{display:none}
#home .hello{font-size:1.6rem;font-weight:700;margin:0 0 8px}
</style>
</head>
<body>
<main>
  <div class="mark" aria-hidden="true">A</div>

  <section id="login">
    <h1>Ajudy</h1>
    <p class="lead">Connectez-vous pour retrouver vos réunions et activités.</p>
    <label for="email">Adresse Gmail</label>
    <input id="email" type="email" autocomplete="email" inputmode="email">
    <label for="pwd">Mot de passe</label>
    <input id="pwd" type="password" autocomplete="current-password">
    <button class="main" id="go">Se connecter</button>
    <button class="link" id="forgot" type="button">Mot de passe oublié ?</button>
    <div id="msg" role="status"></div>
  </section>

  <section id="home">
    <p class="hello" id="hello">Bonjour</p>
    <p class="lead">Vous êtes connecté. La liste des activités arrive à l'étape suivante.</p>
    <button class="main" id="out">Se déconnecter</button>
  </section>
</main>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, signInWithEmailAndPassword, sendPasswordResetEmail, onAuthStateChanged, signOut }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc }
  from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const app = initializeApp({
  apiKey: "AIzaSyAkrUvVoRd7C2mBlimO3cWfbuBfvzNQ9Gc",
  authDomain: "ajudy-22327.firebaseapp.com",
  projectId: "ajudy-22327",
  storageBucket: "ajudy-22327.firebasestorage.app",
  messagingSenderId: "927667970511",
  appId: "1:927667970511:web:f7ffbae9ee51caf3f832ba"
});
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const say = (t, cls) => { $("msg").textContent = t; $("msg").className = cls || ""; };

const erreurs = {
  "auth/invalid-credential": "Adresse ou mot de passe incorrect.",
  "auth/invalid-email": "Cette adresse n'est pas valide.",
  "auth/user-disabled": "Ce compte est désactivé.",
  "auth/too-many-requests": "Trop d'essais. Attendez quelques minutes.",
  "auth/network-request-failed": "Pas de connexion internet.",
  "auth/operation-not-allowed": "La connexion par mot de passe n'est pas activée dans Firebase.",
  "auth/api-key-not-valid.-please-pass-a-valid-api-key.": "La clé API n'est pas valide : vérifiez-la dans firebaseConfig."
};

$("go").onclick = async () => {
  const email = $("email").value.trim(), pwd = $("pwd").value;
  if (!email || !pwd) return say("Saisissez votre adresse et votre mot de passe.", "err");
  $("go").disabled = true; say("Connexion…");
  try { await signInWithEmailAndPassword(auth, email, pwd); say(""); }
  catch (e) { say(erreurs[e.code] || "Connexion impossible (" + e.code + ").", "err"); }
  $("go").disabled = false;
};

$("forgot").onclick = async () => {
  const email = $("email").value.trim();
  if (!email) return say("Saisissez d'abord votre adresse Gmail.", "err");
  try { await sendPasswordResetEmail(auth, email); say("Un e-mail de réinitialisation a été envoyé.", "ok"); }
  catch (e) { say(erreurs[e.code] || "Envoi impossible (" + e.code + ").", "err"); }
};

$("out").onclick = () => signOut(auth);

onAuthStateChanged(auth, async user => {
  $("login").style.display = user ? "none" : "block";
  $("home").style.display = user ? "block" : "none";
  if (!user) return;
  $("hello").textContent = "Bonjour";
  try {
    const snap = await getDoc(doc(db, "utilisateurs", user.uid));
    if (snap.exists() && snap.data().prenom) $("hello").textContent = "Bonjour " + snap.data().prenom;
  } catch (e) { console.error(e); }
});
</script>
</body>
</html>
