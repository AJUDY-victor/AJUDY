<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>AJUDY – Compte-rendu</title>
<style>
:root{--bleu:#1E5FD1;--fond:#F3F6FB;--texte:#14213D;--gris:#5B6780;--ligne:#D5DCEA;--ok:#1B7F4B;--err:#B3261E}
*{box-sizing:border-box}
body{margin:0;background:var(--fond);color:var(--texte);font:16px/1.5 system-ui,sans-serif;padding:16px;max-width:560px;margin-inline:auto}
h1{font-size:1.4rem;margin:8px 0 16px;color:var(--bleu)}
h2{font-size:1.1rem;margin:24px 0 8px}
label{display:block;font-weight:600;margin:14px 0 6px}
input,select,textarea,button{font:inherit;width:100%;padding:12px;border:1px solid var(--ligne);border-radius:10px;background:#fff}
textarea{min-height:140px;resize:vertical}
button{background:var(--bleu);color:#fff;border:0;font-weight:600;margin-top:14px}
button.sec{background:#fff;color:var(--bleu);border:1px solid var(--bleu)}
button:disabled{opacity:.5}
.msg{margin-top:12px;padding:10px 12px;border-radius:10px;display:none}
.msg.ok{display:block;background:#E3F4EA;color:var(--ok)}
.msg.err{display:block;background:#FBE7E6;color:var(--err)}
.vignettes{display:flex;gap:8px;margin-top:10px;flex-wrap:wrap}
.vignettes div{position:relative}
.vignettes img{width:96px;height:96px;object-fit:cover;border-radius:10px;border:1px solid var(--ligne)}
.vignettes .x{position:absolute;top:-6px;right:-6px;width:26px;height:26px;padding:0;margin:0;border-radius:50%;background:var(--err)}
.cr{background:#fff;border:1px solid var(--ligne);border-radius:12px;padding:12px;margin-top:10px}
.cr small{color:var(--gris)}
.cr p{white-space:pre-wrap;margin:6px 0}
.cr .photos{display:flex;gap:6px;flex-wrap:wrap}
.cr .photos img{width:100px;height:100px;object-fit:cover;border-radius:8px}
.cache{display:none}
</style>
</head>
<body>
<h1>AJUDY – Compte-rendu</h1>

<!-- Connexion (affichée seulement si non connecté) -->
<div id="zoneConnexion" class="cache">
  <label for="email">Adresse Gmail</label>
  <input id="email" type="email" autocomplete="email">
  <label for="mdp">Mot de passe</label>
  <input id="mdp" type="password" autocomplete="current-password">
  <button id="btnConnexion">Se connecter</button>
</div>

<!-- Page principale -->
<div id="zoneApp" class="cache">
  <label for="activite">Activité</label>
  <select id="activite"></select>

  <label for="texte">Compte-rendu</label>
  <textarea id="texte" placeholder="Écrivez ici ce qui s'est passé…"></textarea>

  <label>Photos (3 maximum)</label>
  <input id="fichiers" type="file" accept="image/*" multiple class="cache">
  <button class="sec" id="btnPhotos" type="button">Ajouter des photos</button>
  <div class="vignettes" id="vignettes"></div>

  <button id="btnEnvoyer">Enregistrer le compte-rendu</button>
  <div id="msg" class="msg"></div>

  <h2>Comptes-rendus de cette activité</h2>
  <div id="liste"></div>
</div>
<div id="msgGlobal" class="msg"></div>

<script type="module">
import {initializeApp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import {getAuth,onAuthStateChanged,signInWithEmailAndPassword} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import {getFirestore,collection,getDocs,addDoc,query,where,serverTimestamp} from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyAkrUvVoRd7C2mBlimO3cWfbuBfvzNQ9Gc",
  authDomain: "ajudy-22327.firebaseapp.com",
  projectId: "ajudy-22327",
  storageBucket: "ajudy-22327.firebasestorage.app",
  messagingSenderId: "927667970511",
  appId: "1:927667970511:web:f7ffbae9ee51caf3f832ba",
  measurementId: "G-86LW2CHBHT"
};
const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);
const $ = id => document.getElementById(id);
const MAX_PHOTOS = 3;
let photos = [];   // images réduites (texte base64)
let user = null;

function montrer(el, type, texte){ el.className = "msg " + type; el.textContent = texte; }

onAuthStateChanged(auth, async u => {
  user = u;
  $("zoneConnexion").className = u ? "cache" : "";
  $("zoneApp").className = u ? "" : "cache";
  if (u) await chargerActivites();
});

$("btnConnexion").onclick = async () => {
  try { await signInWithEmailAndPassword(auth, $("email").value.trim(), $("mdp").value); }
  catch(e){ montrer($("msgGlobal"), "err", "Connexion impossible : " + e.code); }
};

async function chargerActivites(){
  const snap = await getDocs(collection(db, "activites"));
  const sel = $("activite"); sel.innerHTML = "";
  snap.forEach(d => {
    const a = d.data();
    const o = document.createElement("option");
    o.value = d.id; o.textContent = a.titre || a.Titre || d.id;
    sel.appendChild(o);
  });
  if (!sel.options.length) { const o = document.createElement("option"); o.textContent = "Aucune activité"; sel.appendChild(o); }
  await chargerListe();
}
$("activite").onchange = chargerListe;

async function chargerListe(){
  const id = $("activite").value; const zone = $("liste"); zone.innerHTML = "";
  if (!id) return;
  const snap = await getDocs(query(collection(db, "comptesrendus"), where("activiteId", "==", id)));
  if (snap.empty) { zone.innerHTML = "<p><small>Aucun compte-rendu pour le moment.</small></p>"; return; }
  snap.forEach(d => {
    const c = d.data();
    const div = document.createElement("div"); div.className = "cr";
    const date = c.date && c.date.toDate ? c.date.toDate().toLocaleString("fr-FR") : "";
    const p = document.createElement("p"); p.textContent = c.texte || "";
    const petit = document.createElement("small"); petit.textContent = date;
    div.append(p, petit);
    if (c.photos && c.photos.length) {
      const ph = document.createElement("div"); ph.className = "photos";
      c.photos.forEach(src => { const i = document.createElement("img"); i.src = src; ph.appendChild(i); });
      div.appendChild(ph);
    }
    zone.appendChild(div);
  });
}

// Réduction d'une photo : largeur max 800 px, JPEG qualité 0,6
function reduire(fichier){
  return new Promise((res, rej) => {
    const img = new Image(); const url = URL.createObjectURL(fichier);
    img.onload = () => {
      const k = Math.min(1, 800 / Math.max(img.width, img.height));
      const c = document.createElement("canvas");
      c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); res(c.toDataURL("image/jpeg", 0.6));
    };
    img.onerror = rej; img.src = url;
  });
}

$("btnPhotos").onclick = () => $("fichiers").click();
$("fichiers").onchange = async e => {
  const choisis = [...e.target.files];
  for (const f of choisis) {
    if (photos.length >= MAX_PHOTOS) { montrer($("msg"), "err", "Maximum " + MAX_PHOTOS + " photos par compte-rendu (version gratuite)."); break; }
    try { photos.push(await reduire(f)); } catch(_) { montrer($("msg"), "err", "Cette photo n'a pas pu être lue."); }
  }
  e.target.value = ""; afficherVignettes();
};
function afficherVignettes(){
  const z = $("vignettes"); z.innerHTML = "";
  photos.forEach((src, i) => {
    const d = document.createElement("div");
    const im = document.createElement("img"); im.src = src;
    const x = document.createElement("button"); x.className = "x"; x.textContent = "×"; x.type = "button";
    x.onclick = () => { photos.splice(i, 1); afficherVignettes(); };
    d.append(im, x); z.appendChild(d);
  });
}

$("btnEnvoyer").onclick = async () => {
  const texte = $("texte").value.trim(); const activiteId = $("activite").value;
  if (!activiteId) return montrer($("msg"), "err", "Choisissez une activité.");
  if (!texte && !photos.length) return montrer($("msg"), "err", "Écrivez un texte ou ajoutez une photo.");
  $("btnEnvoyer").disabled = true;
  try {
    await addDoc(collection(db, "comptesrendus"), {
      texte, photos, activiteId,
      auteurId: user.uid, auteurEmail: user.email,
      date: serverTimestamp(), statut: "publie"
    });
    montrer($("msg"), "ok", "Compte-rendu enregistré avec " + photos.length + " photo(s).");
    $("texte").value = ""; photos = []; afficherVignettes(); await chargerListe();
  } catch(e){ montrer($("msg"), "err", "Échec de l'enregistrement : " + (e.code || e.message)); }
  $("btnEnvoyer").disabled = false;
};
</script>
</body>
</html>
